<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到此頁面｜本一聯合診所</title>
<meta name="robots" content="noindex">
<!-- 此頁可能出現在任何網址下：先算出網站根目錄（github.io 專案網址或 pyclinic.com），讓下方連結與圖片都能正確載入 -->
<script>
  (function () {
    var p = location.pathname.split("/");
    var base = /\.github\.io$/.test(location.hostname) && p[1] ? "/" + p[1] + "/" : "/";
    document.write('<base href="' + base + '">');
  })();
</script>
<link rel="icon" href="assets/images/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&amp;family=Noto+Serif+TC:wght@600&amp;display=swap">
<style>
  :root { --navy: #182B40; --ink: #22303F; --muted: #47505B; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 1.25rem 1.25rem 30vh; box-sizing: border-box;
    color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 1.15rem; line-height: 1.9; text-align: center;
    background: url("assets/images/scene/reeds-left.svg") left bottom / auto 42% no-repeat,
                url("assets/images/scene/reeds-right.svg") right bottom / auto 38% no-repeat,
                url("assets/images/scene/river.svg") 62% 100% / cover no-repeat,
                url("assets/images/scene/mountains.svg") 62% 100% / cover no-repeat,
                url("assets/images/scene/sky.svg") 62% 100% / cover no-repeat, #F2E7DC;
  }
  main { max-width: 34rem; background: rgba(255, 255, 255, 0.82); border-radius: 28px; padding: 2.5rem 2rem; box-shadow: 0 18px 40px rgba(24, 43, 64, 0.08); }
  .brand { margin: 0 0 0.5rem; font-family: "Noto Serif TC", serif; letter-spacing: 0.16em; color: var(--muted); }
  h1 { margin: 0 0 0.75rem; font-family: "Noto Serif TC", serif; font-weight: 600; font-size: clamp(2rem, 7vw, 2.8rem); letter-spacing: 0.14em; color: var(--navy); line-height: 1.3; }
  p { margin: 0 0 1.5rem; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
  .btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0.6rem 1.6rem; border-radius: 999px; border: 1.5px solid var(--navy);
         color: var(--navy); text-decoration: none; font-weight: 500; letter-spacing: 0.06em; }
  .btn.primary { background: var(--navy); color: #fff; }
  :focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="brand">本一聯合診所</p>
    <h1>找不到此頁面</h1>
    <p>您要找的頁面不存在或已移動。</p>
    <div class="btn-row">
      <a class="btn primary" href="./">返回本一聯合診所首頁</a>
      <a class="btn" href="tel:+886222836622">來電 (02) 2283-6622</a>
    </div>
  </main>
</body>
</html>
